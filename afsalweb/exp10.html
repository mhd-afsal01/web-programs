<html>
<head>
<title>striped table</title>
<style>
#myTable{
width:100%;
border-collapse:collapse;
}
#myTable th{
padding-top:20px;
padding-bottom:20px;
text-align:left;
color:white;
background-color:#b22222;
border:1px solid grey;
}
#myTable td{
padding:8px;
border:1px solid grey;
}
#myTable tr:nth-child(even){
background-color:#f2f2f2;
}
#myTable tr:hover{
 background-color:#b0e0e6;
 }
 </style>
 </head>
 <body>
 <h2>Striped Table</h2>
 <table id="myTable">
 <tr>
